services:
  - type: web
    name: xira-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_VERSION
        value: v1.0.0-mvp
      - key: XLAYER_RPC_URL
        value: https://testrpc.xlayer.tech
      - key: XIRA_CONTRACT_ADDRESS
        value: "0x64288ccD936470f66D7035e824A9141C938C32AE"
      - key: PRIVATE_KEY
        value: "0x10730a6827a0347c88b80f860f8d41a84b22109f6ebabaf07642a5d1b222f7b7"
      - key: USE_LIVE_DATA
        value: "true"
      - key: AI_MODE
        value: heuristic
    autoDeploy: true
