services:
  - type: web
    name: xira-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_VERSION
        value: v1.0.0
      - key: XLAYER_RPC_URL
        value: https://testrpc.xlayer.tech
      - key: XIRA_CONTRACT_ADDRESS
        value: "0x64288ccD936470f66D7035e824A9141C938C32AE"
      # PRIVATE_KEY must NOT be committed. Set it as a Render dashboard secret
      # (Redacted). If missing, the backend runs in off-chain mode: scores are
      # served but no on-chain attestation transactions are published.
      - key: USE_LIVE_DATA
        value: "true"
      - key: AI_MODE
        value: heuristic
    autoDeploy: true
