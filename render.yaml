services:
  - type: web
    name: xira-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_VERSION
        value: v1.0.0
      - key: XLAYER_RPC_URL
        value: https://rpc.xlayer.tech
      - key: XIRA_CONTRACT_ADDRESS
        value: "0xDe28a2EEc95E3E9Dae6311966Ce2d8B45Db3d41E"
      - key: XIRA_EXPECTED_CHAIN_ID
        value: "196"
      - key: XIRA_CHAIN_LABEL
        value: xlayer-mainnet
      - key: XIRA_EXPLORER_BASE
        value: https://www.okx.com/web3/explorer/xlayer
      # PRIVATE_KEY must NOT be committed. Set it as a hosting secret
      # (Redacted). If missing, the backend runs in off-chain mode: scores are
      # served but no on-chain attestation transactions are published.
      - key: USE_LIVE_DATA
        value: "true"
      - key: AI_MODE
        value: heuristic
    autoDeploy: true
