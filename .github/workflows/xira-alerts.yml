name: XIRA Anomaly Alerts

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check risk anomalies and send webhook alert
        env:
          XIRA_API_URL: https://xira-gsb3.onrender.com
          ALERT_WEBHOOK_URL: ${{ secrets.XIRA_ALERT_WEBHOOK }}
        run: |
          python3 scripts/alert_service.py --once --webhook-url "$ALERT_WEBHOOK_URL"