name: Keep Render backend warm

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: curl -sf -o /dev/null -w "%{http_code}" --max-time 30 https://xira-gsb3.onrender.com/api/assets/health
      - name: Ping assets (gentle wake)
        run: curl -sf -o /dev/null -w "%{http_code}" --max-time 30 https://xira-gsb3.onrender.com/api/assets/all
